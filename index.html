const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const blob = b64(PAYLOAD);
    // openssl salted format: "Salted__" (8 bytes) then an 8 byte salt.
    if (String.fromCharCode(...blob.slice(0, 8)) !== 'Salted__') throw new Error('bad payload');
    const salt = blob.slice(8, 16);
    const data = blob.slice(16);

    const base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(document.getElementById('p').value),
      'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, 384));

    const key = await crypto.subtle.importKey(
      'raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt(
      { name: 'AES-CBC', iv: bits.slice(32, 48) }, key, data);

    document.open();
    document.write(new TextDecoder().decode(plain));
    document.close();
  } catch (_) {
    err.textContent = 'Wrong passphrase.';
  }
});
</script>
